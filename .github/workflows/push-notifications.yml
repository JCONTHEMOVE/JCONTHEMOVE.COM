name: Push Notification Release Checks

on:
  pull_request:
    paths:
      - client/src/lib/notifications.ts
      - client/src/lib/__tests__/notifications.test.ts
      - .github/workflows/push-notifications.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run test:push
      - run: npm run check
      - run: npm run test:server
      - run: npm run build

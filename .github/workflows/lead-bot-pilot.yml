name: Representative lead-bot synthetic acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lead-bot-pilot.yml'
      - 'client/src/pages/lead-bot*'
      - 'client/src/pages/admin/lead-bot-builder.tsx'
      - 'client/src/pages/admin/northwoods-marketing.tsx'
      - 'client/src/App.tsx'
      - 'server/routes.ts'
      - 'server/routes/marketingBot.ts'
      - 'server/routes/leadBotPilot.ts'
      - 'server/services/leadBotPilot.ts'
      - 'server/services/quickRequest.ts'
      - 'server/services/__tests__/leadBotPilot.test.ts'
      - 'shared/leadBotPilot.ts'
      - 'shared/schema.ts'
      - 'scripts/lead-bot*'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jc_ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium --only-shell
      - name: PostgreSQL race, canonical intake and browser acceptance
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jc_ledger_test
        run: node --import tsx server/services/__tests__/leadBotPilot.test.ts --postgres --browser
      - run: npm run build
      # Synthetic fixtures only. No production secrets, migrations or publishing.

name: Production Availability
run-name: ${{ inputs.alert_drill && format('Availability alert drill (intentional {0})', inputs.alert_drill_phase) || 'Production Availability' }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-availability.yml
      - scripts/check-production-deploy.mjs
      - scripts/report-availability.mjs
  schedule:
    # GitHub scheduled workflows can be delayed during high load, especially
    # near the top of the hour. Offset the check to avoid peak scheduling.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      alert_drill:
        description: Test the isolated alert route; skips all production requests
        type: boolean
        required: false
        default: false
      alert_drill_phase:
        description: Fail or resolve the isolated drill incident (requires alert_drill)
        type: choice
        options: [fail, resolve]
        default: fail
      health_url:
        description: Public readiness URL to verify
        required: false
        default: https://www.jconthemove.com/api/health
      expected_commit:
        description: Optional commit SHA to verify after a deployment
        required: false

permissions:
  contents: read

concurrency:
  # Serialize automatic runs so an older result cannot arrive after a newer one.
  # Manual drills never block or refresh the production monitor.
  group: production-availability-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_HEALTH_URL: ${{ github.event.inputs.health_url || vars.PUBLIC_HEALTH_URL || 'https://www.jconthemove.com/api/health' }}
      EXPECTED_COMMIT: ${{ github.event.inputs.expected_commit || '' }}
      EXPECTED_HOSTING_PROVIDER: ${{ vars.EXPECTED_HOSTING_PROVIDER || 'railway' }}
      DEPLOY_CHECK_TIMEOUT_MS: ${{ vars.DEPLOY_CHECK_TIMEOUT_MS || '15000' }}
    steps:
      - name: Exercise the alert path without contacting production
        id: alert_drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_drill }}
        env:
          DRILL_PHASE: ${{ inputs.alert_drill_phase }}
        run: |
          if [ "$DRILL_PHASE" = "resolve" ]; then
            echo "INTENTIONAL DRILL RESOLUTION. Production was not queried or changed."
          else
            echo "::error::INTENTIONAL ALERT DRILL. Production was not queried or changed. Record actual recipient receipt and escalation acknowledgements before closing the alerting gate."
            exit 1
          fi

      - name: Checkout readiness verifier
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.alert_drill) }}
        uses: actions/checkout@v4

      - name: Use Node 20
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.alert_drill) }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify public readiness
        id: readiness
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.alert_drill) }}
        run: node scripts/check-production-deploy.mjs "$PUBLIC_HEALTH_URL"

      - name: Record the monitoring evidence
        if: ${{ always() }}
        env:
          ALERT_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_drill }}
          DRILL_OUTCOME: ${{ steps.alert_drill.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Availability evidence
          - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Trigger: $GITHUB_EVENT_NAME
          - Actor: $GITHUB_ACTOR
          - Workflow ref: $GITHUB_REF
          - Workflow commit: $GITHUB_SHA
          - Synthetic alert drill: $ALERT_DRILL
          - Drill step: $DRILL_OUTCOME
          - Production verifier: $READINESS_OUTCOME

          A failed drill proves the failure signal only. Actual owner receipt,
          escalation acknowledgement, and measured schedule coverage must be
          recorded separately in docs/operations/production-readiness.md.
          EOF

  report:
    name: Report to independent incident service
    needs: readiness
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.alert_drill) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout operational reporter only
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Report verifier result or isolated drill
        env:
          READINESS_RESULT: ${{ needs.readiness.result }}
          ALERT_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_drill }}
          ALERT_DRILL_PHASE: ${{ inputs.alert_drill_phase }}
          OPS_HEARTBEAT_URL: ${{ secrets.OPS_HEARTBEAT_URL }}
          OPS_DRILL_HEARTBEAT_URL: ${{ secrets.OPS_DRILL_HEARTBEAT_URL }}
        run: node scripts/report-availability.mjs

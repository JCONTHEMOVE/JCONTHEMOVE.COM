name: Release Candidate Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: jc_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_test -d jc_ledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Server behavior and authorization tests
        run: npm run test:server
      - name: Payment and reward concurrency in disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://ledger_test:disposable_test_only@127.0.0.1:5432/jc_ledger_test
        run: node --import tsx scripts/check-payment-concurrency.ts
      - name: Reward queue, worker and rollback acceptance
        env:
          TEST_DATABASE_URL: postgresql://ledger_test:disposable_test_only@127.0.0.1:5432/jc_ledger_test
        run: |
          node --import tsx scripts/check-job-ledger-settlement.ts --postgres
          node --import tsx scripts/check-job-cash-credit.ts --postgres
          node --import tsx scripts/check-square-invoice-claims.ts --postgres
          node --import tsx scripts/check-square-invoice-publication.ts --postgres
          node --import tsx scripts/check-square-invoice-intent.ts --postgres
          node --import tsx scripts/check-canonical-invoice.ts --postgres
          node --import tsx scripts/check-invoice-reconciliation-worker.ts --postgres
          node --import tsx scripts/check-financial-notice-delivery.ts --postgres
          node --import tsx scripts/check-financial-notice-worker.ts --postgres
          node --import tsx scripts/check-financial-notice-review.ts --postgres
          node --import tsx scripts/check-quote-approval.ts --postgres
          node --import tsx scripts/test-restore-evidence.ts --postgres
      - name: Monitoring tests without live delivery
        run: node --test scripts/__tests__/*.test.mjs
      - name: Build release candidate
        run: npm run build
      - name: Verify built PWA assets
        run: node scripts/check-built-public-assets.mjs
      # This workflow uses no production secrets and never starts the server,
      # changes production databases, sends alerts, or deploys the candidate.

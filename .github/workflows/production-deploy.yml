name: Production Build and Deploy Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      health_url:
        description: Public readiness URL to verify
        required: false
        default: https://www.jconthemove.com/api/health
      expected_commit:
        description: Commit SHA expected in the public health response
        required: false

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_HEALTH_URL: ${{ github.event.inputs.health_url || vars.PUBLIC_HEALTH_URL || 'https://www.jconthemove.com/api/health' }}
      EXPECTED_COMMIT: ${{ github.event.inputs.expected_commit || github.sha }}
      EXPECTED_HOSTING_PROVIDER: ${{ vars.EXPECTED_HOSTING_PROVIDER || 'railway' }}
      DEPLOY_WAIT_ATTEMPTS: ${{ vars.DEPLOY_WAIT_ATTEMPTS || '50' }}
      DEPLOY_WAIT_SECONDS: ${{ vars.DEPLOY_WAIT_SECONDS || '30' }}
      DEPLOY_CHECK_TIMEOUT_MS: ${{ vars.DEPLOY_CHECK_TIMEOUT_MS || '15000' }}
      DEPLOY_INITIAL_DELAY_SECONDS: ${{ vars.DEPLOY_INITIAL_DELAY_SECONDS || '30' }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run server tests
        run: npm run test:server

      - name: Build release artifact
        run: npm run build

      - name: Wait for Railway Git integration to start the deployment
        run: sleep "$DEPLOY_INITIAL_DELAY_SECONDS"

      - name: Verify public deployment
        run: |
          echo "Waiting for $PUBLIC_HEALTH_URL to report ${EXPECTED_COMMIT:0:8}"
          for attempt in $(seq 1 "$DEPLOY_WAIT_ATTEMPTS"); do
            echo "Production verify attempt $attempt/$DEPLOY_WAIT_ATTEMPTS"
            if node scripts/check-production-deploy.mjs "$PUBLIC_HEALTH_URL"; then
              exit 0
            fi
            sleep "$DEPLOY_WAIT_SECONDS"
          done
          echo "Railway did not make the pushed commit publicly verifiable in time."
          exit 1
